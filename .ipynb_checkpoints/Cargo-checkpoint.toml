[package]
name = "highres"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mm_common = { path = "../mm_common" }
market_type = { path = "market_type" }
markets = { path = "markets" }

ndarray = "0.15"
ndarray-npy = "0.8.1"
log4rs = "1.2.0"
config = "0.11"
serde = { version = "1.0", features = ["derive"] }
