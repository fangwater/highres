lazy_static = "1.4.0"
log = "0.4"
env_logger = "0.9.0"
chrono = "0.4"
ordered-float = "4.1.0"
parking_lot = "0.11"
once_cell = "1.18.0"
rust_decimal = "1.23.0"
csv = "1.1.6"




