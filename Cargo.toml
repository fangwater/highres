[package]
name = "sampling_v6"
version = "0.1.0"
edition = "2021"
autobins = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
mm_common = { path = "mm_common" }
market_type = { path = "market_type" }
markets = { path = "markets" }

tempfile = "3.2.0"  
shellexpand = "2.1.0" 


ndarray = "0.15"
ndarray-npy = "0.8.1"
log4rs = "1.2.0"
config = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
lazy_static = "1.4.0"
log = "0.4"
env_logger = "0.9.0"
chrono = "0.4"
ordered-float = "4.1.0"
parking_lot = "0.11"
once_cell = "1.18.0"
rust_decimal = "1.23.0"
csv = "1.1.6"
zmq = "0.10"
rocksdb = { version = "0.21", default-features = false, features = ["lz4"] }
redis = "0.25"

[features]
mock-v6 = []
stream-v6 = []

[[bin]]
name = "mock_v6"
path = "src/bin/mock_v6.rs"
required-features = ["mock-v6"]

[[bin]]
name = "stream_v6"
path = "src/bin/stream_v6.rs"
required-features = ["stream-v6"]

[[bin]]
name = "stream_pairmm"
path = "src/bin/stream_pairmm.rs"

[[bin]]
name = "stream_pairmm_record"
path = "src/bin/stream_pairmm_record.rs"

[[bin]]
name = "pnlu_factor_stream"
path = "src/bin/pnlu_factor_stream.rs"

[[bin]]
name = "pnlu_factor_rolling_metrics"
path = "src/bin/pnlu_factor_rolling_metrics.rs"
