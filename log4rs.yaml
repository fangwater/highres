refresh_rate: 30 seconds

appenders:
  file:
    kind: rolling_file
    path: "logs/app.log"
    encoder:
      pattern: "{d(%Y-%m-%d %H:%M:%S%.3f)} [{h({l})}] {m}{n}"
    policy:
      trigger:
        kind: size
        limit: 800mb
      roller:
        kind: fixed_window
        pattern: "logs/app-{}.log"
        base: 0
        count: 20

root:
  level: info
  appenders:
    - file
