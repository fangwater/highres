[package]
name = "standalone_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5.20", features = ["derive"] }
ordered-float = "4.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40.0", features = ["macros", "rt", "io-util", "io-std"] }

[dev-dependencies]
pretty_assertions = "1.4.1"

